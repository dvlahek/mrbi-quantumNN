name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify recovered benchmark syntax
        run: python -m py_compile experiments/*.py scripts/*.py

      - name: Run recovered MRBI smoke test
        run: python scripts/run_mrbi_smoke_test.py

      - name: Verify descending-scale MRBI continuation
        run: python scripts/check_continuation.py

      - name: Verify main QNN raw-data coverage and means
        run: python scripts/check_main_raw.py

      - name: Verify recovered five-dataset main summary
        run: python scripts/check_recovered_summary.py

      - name: Verify resumable campaign arguments
        run: python scripts/run_continuation_campaign.py --dry-run --datasets breast_cancer --seeds 0

      - name: Verify fixed-profile final-scale ablation
        run: python scripts/test_final_sigma_ablation.py

      - name: Verify stage-level audit is non-intrusive
        run: python scripts/test_multiscale_stage_audit.py

      - name: Verify smoothed-residual homotopy is opt-in and budget-capped
        run: python scripts/test_smoothed_homotopy.py

      - name: Verify stage-one checkpoint root handling and F/J accounting
        run: python scripts/test_checkpoint_homotopy.py

      - name: Verify frozen fresh-seed single-stage experiment without inspecting held-out outcomes
        run: python scripts/test_heldout_single_stage.py

      - name: Check frozen QNN readout/feature wiring on synthetic data only
        run: python scripts/test_frozen_single_stage_qnn.py

      - name: Confirm frozen new-seed QNN campaign plan without executing it
        run: python scripts/run_frozen_single_stage_qnn.py --dry-run

      - name: Check manuscript summary consistency
        run: python scripts/check_consistency.py

      - name: Check archived supporting raw results
        run: python scripts/check_supporting_raw.py

      - name: Regenerate and check table snippets
        run: |
          python scripts/reproduce_tables.py
          python scripts/check_generated_tables.py

      - name: Regenerate diagnostic figures
        run: |
          python scripts/make_rho_sensitivity_figure.py
          python scripts/make_qubit_width_heatmap.py
