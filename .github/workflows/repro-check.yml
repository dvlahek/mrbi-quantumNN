name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify recovered benchmark syntax
        run: python -m py_compile experiments/*.py scripts/*.py

      - name: Run recovered MRBI smoke test
        run: python scripts/run_mrbi_smoke_test.py

      - name: Verify descending-scale MRBI continuation
        run: python scripts/check_continuation.py

      - name: Verify main QNN raw-data coverage and means
        run: python scripts/check_main_raw.py

      - name: Verify recovered five-dataset main summary
        run: python scripts/check_recovered_summary.py

      - name: Verify resumable campaign arguments
        run: python scripts/run_continuation_campaign.py --dry-run --datasets breast_cancer --seeds 0

      - name: Check manuscript summary consistency
        run: python scripts/check_consistency.py

      - name: Check archived supporting raw results
        run: python scripts/check_supporting_raw.py

      - name: Regenerate and check table snippets
        run: |
          python scripts/reproduce_tables.py
          python scripts/check_generated_tables.py

      - name: Regenerate diagnostic figures
        run: |
          python scripts/make_rho_sensitivity_figure.py
          python scripts/make_qubit_width_heatmap.py
