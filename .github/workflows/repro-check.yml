name: Reproducibility checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile final reproducibility code
        run: |
          python -m py_compile             experiments/mrbi.py             experiments/main_qnn_benchmark.py             scripts/run_mrbi_smoke_test.py             scripts/check_continuation.py             scripts/run_continuation_campaign.py             scripts/summarize_continuation.py             scripts/run_locked_selected_profile_confirmation.py             scripts/summarize_locked_selected_profile_confirmation.py             scripts/check_final_results.py

      - name: Run MRBI smoke test
        run: python scripts/run_mrbi_smoke_test.py

      - name: Verify corrected continuation schedule
        run: python scripts/check_continuation.py

      - name: Verify final results and fixed profile map
        run: python scripts/check_final_results.py

      - name: Verify fixed confirmation plan without QNN training
        run: python scripts/run_locked_selected_profile_confirmation.py --dry-run --seed 40
